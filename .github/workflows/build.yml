name: CI/CD

on:
  push:
    branches: [evon-dc]
  pull_request:
    branches: [evon-dc]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & Package
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          echo "Client ID length: ${#ANYPOINT_CLIENT_ID}"
          mvn -B -s settings.xml clean package

  deploy:
    needs: build
    if: github.ref == 'refs/heads/evon-dc' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Deploy to CloudHub 2.0
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ENV: ${{ secrets.ANYPOINT_ENV }}
          ANYPOINT_TARGET: ${{ secrets.ANYPOINT_TARGET }}
        run: |
          echo "ENV length: ${#ANYPOINT_ENV}"
          echo "TARGET length: ${#ANYPOINT_TARGET}"
          echo "TARGET value: ${ANYPOINT_TARGET}"
          mvn -e -B -s settings.xml clean deploy -DmuleDeploy -DskipTests \
            "-Danypoint.environment=${ANYPOINT_ENV}" \
            "-Danypoint.target=${ANYPOINT_TARGET}" \
            "-Danypoint.client_id=${ANYPOINT_CLIENT_ID}" \
            "-Danypoint.client_secret=${ANYPOINT_CLIENT_SECRET}"
